[package]
name = "shredstream-example"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# Standalone crate — opt out of any parent workspace.
[workspace]

[dependencies]
anyhow = "1"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
solana-entry = "2.2"
solana-sdk = "2.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.13", features = ["tls-native-roots", "tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
prost = "0.13"
tonic-build = "0.13"
protobuf-src = "1"
