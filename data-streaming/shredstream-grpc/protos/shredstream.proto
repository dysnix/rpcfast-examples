syntax = "proto3";

package shredstream;

// Minimal subset of the Jito shredstream-proxy proto, sufficient to
// subscribe to deserialized entries. Drop in the upstream proto if you
// also need heartbeats / regions / trace shreds.

service ShredstreamProxy {
  rpc SubscribeEntries(SubscribeEntriesRequest) returns (stream Entry);
}

message SubscribeEntriesRequest {}

message Entry {
  // The slot the entry belongs to.
  uint64 slot = 1;

  // bincode-serialized `Vec<solana_entry::entry::Entry>`.
  bytes entries = 2;
}
